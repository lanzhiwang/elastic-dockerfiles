# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
  push:
    branches: ["learn-v9.5.4"]
  pull_request:
    branches: ["learn-v9.5.4"]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # elasticsearch
      - name: Extract metadata (tags, labels) for elasticsearch Docker
        id: meta-elasticsearch
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: lanzhiwang/elasticsearch
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push elasticsearch Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./elasticsearch/
          file: ./elasticsearch/Dockerfile
          push: true
          tags: ${{ steps.meta-elasticsearch.outputs.tags }}
          labels: ${{ steps.meta-elasticsearch.outputs.labels }}

      # kibana
      - name: Extract metadata (tags, labels) for kibana Docker
        id: meta-kibana
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: lanzhiwang/kibana
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push kibana Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./kibana/
          file: ./kibana/Dockerfile
          push: true
          tags: ${{ steps.meta-kibana.outputs.tags }}
          labels: ${{ steps.meta-kibana.outputs.labels }}

      # logstash
      - name: Extract metadata (tags, labels) for logstash Docker
        id: meta-logstash
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: lanzhiwang/logstash
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push logstash Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./logstash/
          file: ./logstash/Dockerfile
          push: true
          tags: ${{ steps.meta-logstash.outputs.tags }}
          labels: ${{ steps.meta-logstash.outputs.labels }}
